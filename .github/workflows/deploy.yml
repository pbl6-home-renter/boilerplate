name: Build, Push and Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: 'Trigger deployment to EC2 after building'
        required: false
        default: true
        type: boolean

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image (linux/amd64 for EC2)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rentify-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' || inputs.deploy_to_ec2 == true) && secrets.EC2_HOST != '' }}

    steps:
      - name: SSH to EC2 and Trigger Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "[+] Accessing infra directory..."
            cd /home/ubuntu/infra || cd ~/infra
            echo "[+] Pulling latest images & reloading containers..."
            ./scripts/deploy.sh
